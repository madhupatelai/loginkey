<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key Login</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{width:min(420px,90vw);padding:28px;border:1px solid #26304b;border-radius:18px;background:#121a2d;box-shadow:0 20px 60px #0008}
h1{margin-top:0}.muted{color:#9aa6bf}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;margin-top:10px;border:1px solid #34415f}
input{background:#0c1324;color:#fff}button{background:#fff;color:#111;font-weight:700;cursor:pointer}
#msg{margin-top:14px}.ok{color:#6ee7a8}.err{color:#ff8f8f}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Key Login</h1>
  <p class="muted">Enter your access key to continue.</p>
  <input id="key" placeholder="KEY-XXXXXXXXXXXX">
  <button onclick="login()">Login</button>
  <div id="msg"></div>
</div>
<script>
async function login(){
  const msg=document.getElementById("msg");
  msg.textContent="Checking...";
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:document.getElementById("key").value.trim()})});
  const d=await r.json();
  msg.className=r.ok?"ok":"err";
  msg.textContent=d.message||d.error;
}
</script>
</body>
</html>
